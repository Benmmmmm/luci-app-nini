name: Build NINI APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  SDK_URL: https://downloads.immortalwrt.org/releases/25.12.0/targets/mediatek/filogic/immortalwrt-sdk-25.12.0-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev python3 python3-distutils python3-setuptools \
          rsync subversion swig time xsltproc zlib1g-dev zstd wget curl
      continue-on-error: false

    - name: Download SDK
      run: |
        echo "Downloading SDK..."
        curl -L --retry 3 --max-time 600 -o sdk.tar.zst "$SDK_URL"
        ls -lh sdk.tar.zst
        file sdk.tar.zst

    - name: Extract SDK
      run: |
        tar --zstd -xf sdk.tar.zst
        ls -d immortalwrt-sdk-* || ls -d openwrt-sdk-*
        mv immortalwrt-sdk-* sdk 2>/dev/null || mv openwrt-sdk-* sdk
        ls sdk/

    - name: Setup feeds
      run: |
        cd sdk
        ./scripts/feeds update -a || true
        ./scripts/feeds install -a || true

    - name: Copy package
      run: |
        cp -r "$GITHUB_WORKSPACE" sdk/package/luci-app-nini
        ls sdk/package/luci-app-nini/

    - name: Configure
      run: |
        cd sdk
        echo "CONFIG_PACKAGE_luci-app-nini=m" > .config
        make defconfig
        grep luci-app-nini .config

    - name: Build
      run: |
        cd sdk
        make package/luci-app-nini/compile V=s -j$(nproc)

    - name: Collect APK
      run: |
        cd sdk
        find bin -name "luci-app-nini*.apk" -exec ls -lh {} \;
        find bin -name "luci-app-nini*.apk" -exec cp {} "$GITHUB_WORKSPACE/" \;

    - name: Upload
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: luci-app-nini-apk
        path: luci-app-nini*.apk
        if-no-files-found: warn
